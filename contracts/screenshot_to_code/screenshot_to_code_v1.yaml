  - /catalog/variables/variables-list.md
  - src/main/webapp/pages/header/header.html
  - src/main/webapp/pages/leftnav/leftnav.html

resources:
  page:
    - name: CreateProduct
      path: src/main/webapp/pages/CreateProduct/CreateProduct.html
      variable:
        - name: product_variable
          path: src/main/webapp/pages/CreateProduct/CreateProduct.variables.json
      javascript:
        - name: main
          path: src/main/webapp/pages/CreateProduct/CreateProduct.js
    - name: createProductHeader
      path: src/main/webapp/pages/createProductHeader/createProductHeader.html
  design_tokens:
    - name: CreateProduct
      path: src/main/webapp/pages/CreateProduct/CreateProduct.tokens-plan.json

input_context: []

output:
  - resource: page.CreateProduct
    operation: CREATE
  - resource: page.CreateProduct.variable.product_variable
    operation: CREATE
  - resource: page.CreateProduct.javascript.main
    operation: UPDATE
  - resource: design_tokens.CreateProduct
    operation: UPDATE
  - resource: page.createProductHeader
    operation: CREATE

tools:
  required: [platform_createWebPage, platform_listPages, ui_createNonApiAwareVariable, write_file]
  optional: [platform_getSessionResource, find_files_by_glob, load_skill, start_new_conversation_with_agent, ui_getPageScreenshot, read_files, edit_file_content, create_variable]
  forbidden: [delete_file]
