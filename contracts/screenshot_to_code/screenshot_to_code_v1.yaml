workflow: screenshot_to_code
contract_version: "1.0.0"

skills:
  required:
    - screenshot-to-wavemaker-web
    - new_page_from_screenshot_workflow
    - components-list
    - page-layouts
    - foundation-tokens
    - phase3-tokens
    - variables
    - pattern-detection
    - container-system
    - layout-rules
    - widget-templates
    - widget-defaults
  optional: [output-cloud, explore-codebase, interaction-patterns, advanced-tabs, advanced-form, token-schema, partial-templates]

knowledge:
  - /catalog/components/wm-table-column/wm-table-column.md
  - /catalog/components/wm-table/wm-table.md
  - /catalog/variables/ApiAwareVariable/ApiAwareVariable.md
  - /catalog/variables/BaseVariable/BaseVariable.md
  - /catalog/variables/ServiceVariable/ServiceVariable.md
