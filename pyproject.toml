[project]
name = "wm-agents-validator"
version = "0.1.0"
description = "Validate agent runs by comparing Langfuse traces against workflow contracts via pluggable evaluators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langfuse @ git+https://github.com/udayshnk/langfuse-python@d81d23081d2a8b5ae09a2a46e9e4bea3b3660eb4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
fetch-trace = "wm_agents_validator.cli.fetch_trace:main"
debug-trace = "wm_agents_validator.cli.debug_trace:main"
run-verify = "wm_agents_validator.cli.run_verify:main"
compare-traces = "wm_agents_validator.cli.compare_traces:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/wm_agents_validator"]

[tool.hatch.build.targets.wheel.sources]
"src/wm_agents_validator" = "wm_agents_validator"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
